<div class="scene" aria-hidden="true">
  @switch (scene()) {
    @case ('stars') {
      <span class="nebula"></span>
    }
    @case ('rain') {
      <span class="leaves"></span>
    }
    @case ('piano') {
      <span class="glow"></span>
    }
  }

  @if (scene() === 'waves' || scene() === 'ocean') {
    <div class="waves">
      @for (layer of waveLayers; track layer) {
        <svg [class]="'wave wave-' + layer" viewBox="0 0 2400 200" preserveAspectRatio="none">
          <path
            d="M0,60 C200,0 400,0 600,60 C800,120 1000,120 1200,60 C1400,0 1600,0 1800,60 C2000,120 2200,120 2400,60 L2400,200 L0,200 Z"
          />
        </svg>
      }
    </div>
  }

  @for (particle of particles(); track $index) {
    <span
      class="particle"
      [style.left.%]="particle.x"
      [style.top.%]="particle.y"
      [style.--size]="particle.size + 'px'"
      [style.animation-duration.s]="particle.duration"
      [style.animation-delay.s]="-particle.delay"
      >{{ particle.glyph }}</span
    >
  }
</div>

<div class="breath" aria-hidden="true">
  <span>{{ 'session.breathe' | translate }}</span>
</div>

<ng-content></ng-content>
