<div class="auth-page">
  <p-card header="Iniciar sesión">
    @if (auth.error()) {
      <p-message severity="error">{{ auth.error() }}</p-message>
    }
    <div class="form">
      <label>Correo <input pInputText [(ngModel)]="email" type="email" autocomplete="email" /></label>
      <label>Contraseña <p-password [(ngModel)]="password" [feedback]="false" [toggleMask]="true"></p-password></label>
      <p-button label="Entrar" [loading]="auth.loading()" (onClick)="submit()"></p-button>
    </div>
    <p-divider></p-divider>
    <p-button label="Continuar con Google" icon="pi pi-google" variant="outlined" (onClick)="google()"></p-button>
    <p>¿Sin cuenta? <a routerLink="/auth/sign-up">Regístrate</a></p>
  </p-card>
</div>
