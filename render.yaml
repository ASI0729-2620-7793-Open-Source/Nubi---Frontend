# API falsa (json-server) de Nubi. El frontend se despliega aparte en Firebase Hosting.
services:
  - type: web
    name: nubi-api
    runtime: node
    plan: free
    rootDir: Nubi
    buildCommand: npm ci --omit=dev
    startCommand: npm run api
    healthCheckPath: /api/caregivers
    envVars:
      # Clave de cuenta de servicio de Firebase (JSON completo). Se pega en Render, no va en el repo.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
